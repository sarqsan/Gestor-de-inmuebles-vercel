name: Deploy Firestore Rules to Production

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and Deploy Firestore Rules
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Firestore Rules and Configuration
        run: |
          echo "=== [1/3] Verificando existencia e integridad de archivos ==="
          if [ ! -f "firestore.rules" ]; then
            echo "ERROR: 'firestore.rules' no existe en la raiz del repositorio."
            exit 1
          fi

          if [ ! -s "firestore.rules" ]; then
            echo "ERROR: 'firestore.rules' esta vacio (0 bytes)."
            exit 1
          fi

          if [ ! -f "firebase.json" ]; then
            echo "ERROR: 'firebase.json' no existe en la raiz del repositorio."
            exit 1
          fi

          echo "=== [2/3] Validando declaracion de servicio en firestore.rules ==="
          if ! grep -q "service cloud.firestore" firestore.rules; then
            echo "ERROR: 'firestore.rules' no contiene la declaracion obligatoria 'service cloud.firestore'."
            exit 1
          fi

          echo "=== [3/3] Ejecutando arnes de pruebas de reglas ==="
          if [ -f "src/features/operaciones/tests/rules-harness.test.mjs" ]; then
            node --test src/features/operaciones/tests/rules-harness.test.mjs
          else
            echo "Aviso: arnes no encontrado en esta ruta; comprobacion estructural completada."
          fi

          echo "Validacion previa completada exitosamente."

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Firestore Rules to Production
        run: |
          npx firebase-tools deploy \
            --only firestore:rules \
            --project gestor-inmuebles-produccion \
            --non-interactive
