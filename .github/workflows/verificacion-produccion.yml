# Verificación EN VIVO del despliegue de producción — solo lectura.
# ---------------------------------------------------------------------------
# Este job existe porque el entorno de desarrollo del proyecto no tiene salida a
# `*.vercel.app`: sin él, "producción responde bien" sería una afirmación sin
# prueba. Aquí un runner de GitHub sí llega, y el resultado se publica como
# resumen del propio run (evidencia fechada, repetible y sin secretos).
#
# Qué hace:
#   1. Resuelve la URL del despliegue de producción más reciente vía la API de
#      GitHub (status `environment_url` de Vercel). Si se pasa `url` a mano, usa
#      esa.
#   2. Ejecuta `scripts/verificar-produccion.mjs`, que solo hace:
#        GET  /api/health                  → 200 con esquema 1 y capacidades
#        POST /api/actas/otp/entregar      → 410 (ruta retirada)
#        POST /api/actas/otp/solicitar     → 401 sin sesión (no genera OTP)
#        POST /api/solicitud (300 KB)      → 413 (límite antes de parsear)
#      Si alguna de esas cuatro respuestas cambia, el run se pone ROJO.
#   3. No usa credenciales de la aplicación, no escribe datos y no necesita
#      `npm ci` (el script solo usa módulos nativos de Node).
#
# Disparadores: push a main (evidencia en cada despliegue), diario (vigilancia) y
# manual. Se añadió `push` porque lanzarlo a mano exige permiso `actions:write`,
# que una integración de solo lectura no tiene; así la verificación no depende de
# que alguien se acuerde ni de credenciales elevadas.
name: Verificación de producción (solo lectura)

on:
  # Se ejecuta sola: tras cada fusión a main (para no depender de permisos de
  # `workflow_dispatch` al lanzarla a mano) y una vez al día como vigilancia.
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL del despliegue (vacío = resolver el último de producción)'
        required: false
        type: string
      host_esperado:
        description: 'Host que debe coincidir (opcional, guardia extra)'
        required: false
        type: string

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  verificar:
    name: Salud y rechazos esperados en producción
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolver el despliegue de producción
        id: destino
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL_MANUAL: ${{ inputs.url }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          candidatos=()
          [ -n "${URL_MANUAL:-}" ] && candidatos+=("$URL_MANUAL")

          # Despliegue de producción DEL COMMIT DE ESTE RUN.
          #
          # Bug corregido el 28-10-2026: antes se tomaba «el último despliegue de
          # producción en éxito» en el instante de arrancar. Tras un push a main,
          # Vercel todavía no ha construido ese commit (tarda ~1 min), así que el
          # run sellaba como verificado el despliegue ANTERIOR: la evidencia
          # parecía buena y hablaba de otro código. Se detectó al fusionar H-06
          # (run 40756373910 verificó `0622e5a` cuando el merge era `8a1e84b`).
          #
          # Ahora se espera (hasta 6 min) al despliegue cuyo `sha` es el del run.
          # Si no aparece, se cae al último en éxito —para no dejar el cron sin
          # vigilancia— pero se emite `::warning` y el resumen dice qué commit se
          # verificó de verdad.
          emparejado_url=""
          sha_verificado=""
          if [ -n "${URL_MANUAL:-}" ]; then
            sha_verificado="(manual)"
          else
            for intento in $(seq 1 24); do
              for id in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=15" \
                           --jq '[.[] | select(.sha == env.SHA) | .id] | .[]'); do
                estado=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[0].state // empty')
                url=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[0].environment_url // empty')
                if [ "$estado" = "success" ] && [ -n "$url" ]; then
                  emparejado_url="$url"
                  sha_verificado="$GITHUB_SHA"
                  break
                fi
              done
              [ -n "$emparejado_url" ] && break
              echo "Esperando el despliegue de ${GITHUB_SHA:0:7} en producción (intento ${intento}/24)…"
              sleep 15
            done

            if [ -n "$emparejado_url" ]; then
              candidatos+=("$emparejado_url")
            else
              echo "::warning title=Sin despliegue de este commit::No hay despliegue de producción con sha ${GITHUB_SHA:0:7}. Se verifica el último en éxito; la evidencia NO corresponde a este commit."
              for id in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=10" --jq '.[].id'); do
                estado=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[0].state // empty')
                url=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[0].environment_url // empty')
                if [ "$estado" = "success" ] && [ -n "$url" ]; then
                  candidatos+=("$url")
                  sha_verificado=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq '.sha')
                  break
                fi
              done
            fi
          fi

          # Alias estable del proyecto: los dominios por-deployment pueden estar
          # detrás de "Vercel Authentication" (responden 401 a todo, incluso a
          # /api/health), mientras el dominio de producción sí es público.
          proyecto=$(basename "${GITHUB_REPOSITORY}")
          candidatos+=("https://${proyecto}.vercel.app")

          elegida=""
          declare -a informe=()
          for url in "${candidatos[@]}"; do
            codigo=$(curl -s -o /dev/null -m 12 -w '%{http_code}' "${url%/}/api/health" || echo 000)
            informe+=("{\"url\":\"${url}\",\"health\":${codigo}}")
            echo "Candidato ${url} → /api/health HTTP ${codigo}"
            if [ "$codigo" = "200" ] && [ -z "$elegida" ]; then elegida="$url"; fi
          done

          {
            echo '### Candidatos probados'
            echo '| URL | /api/health |'
            echo '|---|---|'
            for fila in "${informe[@]}"; do
              u=$(echo "$fila" | sed 's/.*"url":"\([^"]*\)".*/\1/')
              c=$(echo "$fila" | sed 's/.*"health":\([0-9]*\).*/\1/')
              echo "| \`$u\` | $c |"
            done
            if [ -z "$elegida" ]; then
              echo '> **Ningún candidato respondió 200.** Un `401` en todas las rutas, incluido'
              echo '> `/api/health`, indica **protección de despliegue de Vercel** (Vercel'
              echo '> Authentication) delante del dominio: no es un fallo del servidor.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$elegida" ]; then
            echo "::error title=Sin destino verificable::Ningún candidato dio 200 en /api/health. Revisa el resumen del run (tabla de candidatos) y, si todos dan 401, desactiva la protección de despliegue o usa el dominio público de producción."
            exit 1
          fi
          echo "::notice title=Destino verificado::${elegida}"
          echo "url=${elegida}" >> "$GITHUB_OUTPUT"
          echo "sha_verificado=${sha_verificado}" >> "$GITHUB_OUTPUT"
          {
            echo ''
            echo "**Commit verificado:** \`${sha_verificado:-desconocido}\` · **destino:** \`${elegida}\`"
            if [ "${sha_verificado}" != "$GITHUB_SHA" ] && [ -z "${URL_MANUAL:-}" ]; then
              echo ''
              echo "> ⚠️ El despliegue verificado **no** es el commit de este run (\`${GITHUB_SHA:0:7}\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar (solo lectura)
        env:
          URL_PRODUCCION: ${{ steps.destino.outputs.url }}
          HOST_ESPERADO: ${{ inputs.host_esperado }}
        run: |
          set -euo pipefail
          args=(--url "$URL_PRODUCCION" --json)
          if [ -n "${HOST_ESPERADO:-}" ]; then args+=(--host-esperado "$HOST_ESPERADO"); fi
          set +e
          salida=$(node scripts/verificar-produccion.mjs "${args[@]}" 2>&1)
          codigo=$?
          set -e
          echo "$salida"
          # Los logs no siempre son descargables desde según qué entornos, así que
          # cada comprobación fallida se publica ADEMÁS como anotación del run: la
          # evidencia queda legible por API y en la pestaña del propio job.
          echo "$salida" | node -e '
            let datos = "";
            process.stdin.on("data", (c) => (datos += c));
            process.stdin.on("end", () => {
              let informe;
              try { informe = JSON.parse(datos); } catch { process.exit(0); }
              for (const c of informe.comprobaciones || []) {
                const linea = `${c.nombre}: ${c.detalle}`;
                if (c.estado === "OK") console.log(`::notice title=OK ${c.nombre}::${c.detalle}`);
                else console.log(`::error title=FALLO ${c.nombre}::${linea}`);
              }
            });
          '
          {
            echo '## Verificación de producción'
            echo "Destino: \`${URL_PRODUCCION}\`"
            echo '```json'
            echo "$salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $codigo
